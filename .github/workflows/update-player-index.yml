name: Update Sleeper Player Index

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Sleeper player index
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          url = "https://api.sleeper.app/v1/players/nfl?active=true"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Loren-Sleeper-Monitor/1.0"}
          )

          with urllib.request.urlopen(req) as response:
              data = json.load(response)

          players = {}

          for player_id, p in data.items():
              name = p.get("full_name")

              if not name:
                  first = p.get("first_name") or ""
                  last = p.get("last_name") or ""
                  name = f"{first} {last}".strip()

              players[player_id] = {
                  "name": name or f"Player {player_id}",
                  "position": p.get("position"),
                  "team": p.get("team"),
                  "injury_status": p.get("injury_status"),
                  "status": p.get("status"),
                  "practice_participation": p.get(
                      "practice_participation"
                  ),
                  "depth_chart_position": p.get(
                      "depth_chart_position"
                  )
              }

          output = {
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "players": players
          }

          with open(
              "player-index.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )
          PY

      - name: Commit updated player index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add player-index.json

          if git diff --cached --quiet; then
            echo "No player changes"
          else
            git commit -m "Update Sleeper player index"
            git push
          fi
